[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiolumagen"
version = "0.10.0"
description = "Async Python library for the Lumagen Radiance Pro RS-232 protocol, with direct-serial and ESPHome serial-proxy transports."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Frank Rosano" }]
keywords = ["lumagen", "radiance-pro", "home-assistant", "esphome", "video-processor", "rs232"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    # Deliberately WITHOUT the [esphome] extra. That extra only adds
    # aioesphomeapi, and serialx imports it lazily (per URL scheme), so
    # omitting it removes no capability whenever the package is present for
    # another reason.
    #
    # It matters because Home Assistant pins aioesphomeapi *exactly* for its
    # own esphome integration, and installs custom-integration requirements
    # into the same site-packages. Any range we declare for a package we don't
    # own gives the resolver licence to move HA's pin, and rewriting a Cython
    # package's .so files under a running HA leaves a mixed set on disk —
    # observed as "APIConnection size changed" / "does not export expected C
    # function make_noise_packets" and a dead ESPHome integration.
    #
    # That pin is NOT static; it moves most HA releases. Two observed points:
    #   HA 2026.5.1 -> aioesphomeapi==44.21.0
    #   HA 2026.7.4 -> aioesphomeapi==45.3.1
    # A major version in two minor releases. That drift is precisely why this
    # can't be solved by matching HA's pin here — any value we wrote would be
    # wrong by the next release. Read the current one from the horse's mouth:
    # homeassistant/components/esphome/manifest.json in the target install.
    #
    # HA guarantees the package is present anyway: its `usb` integration
    # imports serialx.platforms.serial_esphome at module scope (via
    # serial_proxy_stub), so aioesphomeapi is loaded by any install that
    # brings up `usb` — which ha-lumagen requires. Users outside HA opt in via
    # the `esphome` extra below.
    "serialx>=1.7",
]

[project.optional-dependencies]
# For consumers outside Home Assistant: pulls in aioesphomeapi so
# `esphome://` URLs work out of the box. `pip install aiolumagen[esphome]`.
esphome = ["serialx[esphome]>=1.7"]

[project.urls]
Homepage = "https://github.com/frankrosano/aiolumagen"
Repository = "https://github.com/frankrosano/aiolumagen"
Issues = "https://github.com/frankrosano/aiolumagen/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiolumagen"]

[tool.hatch.build.targets.sdist]
include = [
    "src/aiolumagen",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle, pyflakes
    "I",               # isort
    "N",               # pep8-naming
    "UP",              # pyupgrade
    "B",               # flake8-bugbear
    "A",               # flake8-builtins
    "C4",              # flake8-comprehensions
    "SIM",             # flake8-simplify
    "RUF",             # ruff-specific
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
